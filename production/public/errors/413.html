<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>413 Payload Too Large</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0d14;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}.card{text-align:center;max-width:520px;width:100%;padding:3rem 2.5rem 2.5rem;background:#141824;border:1px solid #1e2740;border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.5)}.code{font-size:6rem;font-weight:900;letter-spacing:-4px;line-height:1;background:linear-gradient(135deg,#f97316,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}.title{font-size:1.35rem;font-weight:700;color:#f1f5f9;margin-bottom:.75rem}.desc{color:#64748b;line-height:1.7;font-size:.95rem;margin-bottom:2rem}.actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.4rem;border-radius:8px;font-size:.875rem;font-weight:600;text-decoration:none;transition:opacity .15s;cursor:pointer;border:none}.btn:hover{opacity:.85}.btn-primary{background:#4f46e5;color:#fff}.btn-ghost{background:transparent;color:#94a3b8;border:1px solid #1e2740}.divider{width:48px;height:1px;background:#1e2740;margin:1.5rem auto}.footer{display:flex;flex-direction:column;align-items:center;gap:.6rem}.footer img{height:28px;width:auto;opacity:.7;filter:brightness(1.2)}.footer-text{font-size:.7rem;color:#334155;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="code">413</div>
  <div class="title">Payload Too Large</div>
  <p class="desc">The request body exceeds the maximum allowed size.<br>Please reduce the size of your request and try again.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">&#8592; Back to Home</a>
    <button onclick="history.back()" class="btn btn-ghost">Go Back</button>
  </div>
  <div class="divider"></div>
  <div class="footer">
    <img src="/logo.png" alt="FlashLin" onerror="this.style.display='none'">
    <span class="footer-text">FlashLin</span>
  </div>
</div>
</body>
</html>
