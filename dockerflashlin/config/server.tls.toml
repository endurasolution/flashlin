# ─────────────────────────────────────────────────────────────────────────────
# FlashLin — Docker server.toml  (HTTPS / TLS enabled)
#
# Usage:
#   Put your certificates in ./certs/:
#     certs/fullchain.pem   — certificate + intermediate chain
#     certs/privkey.pem     — private key
#
#   Then run:
#     docker compose -f docker-compose.tls.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

[server]
host         = "0.0.0.0"
port         = 443            # HTTPS listener
server_name  = "FlashLin"
read_timeout  = "30s"
write_timeout = "60s"
keep_alive         = true
keep_alive_timeout = "75s"
root  = "/var/www/html"
index = ["index.html"]
max_connections = 0

# ─────────────────────────────────────────────────────────────────────────────
# TLS — certificate paths inside the container
# ─────────────────────────────────────────────────────────────────────────────
[tls]
enabled                = true
cert                   = "/etc/flashlin/certs/fullchain.pem"
key                    = "/etc/flashlin/certs/privkey.pem"
redirect_http_to_https = true   # port 80 → 301 → https://
http_port              = 80     # companion HTTP listener for the redirect

# ─────────────────────────────────────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────────────────────────────────────
[security]
max_body_size        = "20MB"
max_header_size      = "32KB"
hide_server_header   = true
block_dotfiles       = true
block_sensitive_files = true
security_headers     = true

[security.rate_limit]
limit = "200/min"
burst = 50

# ─────────────────────────────────────────────────────────────────────────────
# Compression
# ─────────────────────────────────────────────────────────────────────────────
[compression]
gzip     = true
brotli   = true
min_size = 1024

# ─────────────────────────────────────────────────────────────────────────────
# In-memory response cache
# ─────────────────────────────────────────────────────────────────────────────
[cache]
enabled       = true
max_size      = "128MB"
ttl           = "300s"
max_file_size = "10MB"

# ─────────────────────────────────────────────────────────────────────────────
# Routes
# ─────────────────────────────────────────────────────────────────────────────
[[routes]]
path              = "/"
root              = "/var/www/html"
index             = "index.html"
php_enabled       = false
directory_listing = false

# Reverse proxy example
# [[routes]]
# path       = "/api"
# proxy_pass = "http://backend:3000"

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
[logging]
level = "info"
json  = true
