# ─────────────────────────────────────────────────────────────────────────────
# FlashLin — Docker server.toml  (PHP-FPM via docker-compose.php.yml)
# php-fpm container is reachable at hostname "php-fpm" on port 9000
# ─────────────────────────────────────────────────────────────────────────────

[server]
host         = "0.0.0.0"
port         = 80             # Change to 443 when TLS is enabled
server_name  = "FlashLin"
read_timeout  = "30s"
write_timeout = "60s"
keep_alive         = true
keep_alive_timeout = "75s"
root  = "/var/www/html"
index = ["index.html", "index.php"]
max_connections = 0

# ─────────────────────────────────────────────────────────────────────────────
# TLS / HTTPS
#
# How to enable:
#   1. Mount your certificates:
#        volumes:
#          - ./certs:/etc/flashlin/certs:ro
#   2. Uncomment the [tls] block below
#   3. Change server.port to 443
#   4. Restart the container
# ─────────────────────────────────────────────────────────────────────────────
# [tls]
# enabled                = true
# cert                   = "/etc/flashlin/certs/fullchain.pem"
# key                    = "/etc/flashlin/certs/privkey.pem"
# redirect_http_to_https = true
# http_port              = 80

# ─────────────────────────────────────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────────────────────────────────────
[security]
max_body_size        = "20MB"
max_header_size      = "32KB"
hide_server_header   = true
block_dotfiles       = true
block_sensitive_files = true
security_headers     = true

[security.rate_limit]
limit = "200/min"
burst = 50

# ─────────────────────────────────────────────────────────────────────────────
# Compression
# ─────────────────────────────────────────────────────────────────────────────
[compression]
gzip     = true
brotli   = true
min_size = 1024

# ─────────────────────────────────────────────────────────────────────────────
# In-memory response cache (static files only — PHP responses never cached)
# ─────────────────────────────────────────────────────────────────────────────
[cache]
enabled       = true
max_size      = "128MB"
ttl           = "300s"
max_file_size = "10MB"

# ─────────────────────────────────────────────────────────────────────────────
# PHP-FPM — connects to the php-fpm service via TCP
# ─────────────────────────────────────────────────────────────────────────────
[php]
enabled         = true
default_handler = "php82"

[[php.handlers]]
name          = "php82"
mode          = "fpm"
address       = "php-fpm:9000"    # Docker service hostname
document_root = "/var/www/html"
index         = "index.php"
timeout       = "30s"
max_body_size = "20MB"

# ─────────────────────────────────────────────────────────────────────────────
# Routes
# ─────────────────────────────────────────────────────────────────────────────
[[routes]]
path        = "/"
root        = "/var/www/html"
index       = "index.php"
php_handler = "php82"
php_enabled = true

# Static assets — served directly without PHP
# [[routes]]
# path          = "/assets"
# root          = "/var/www/html/assets"
# php_enabled   = false
# cache_control = "public, max-age=31536000, immutable"

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
[logging]
level = "info"
json  = true
