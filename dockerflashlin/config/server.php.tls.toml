# ─────────────────────────────────────────────────────────────────────────────
# FlashLin — Docker server.toml  (PHP-FPM + HTTPS / TLS enabled)
#
# Usage:
#   Put your certificates in ./certs/:
#     certs/fullchain.pem
#     certs/privkey.pem
#
#   Then run:
#     docker compose -f docker-compose.php.tls.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

[server]
host         = "0.0.0.0"
port         = 443
server_name  = "FlashLin"
read_timeout  = "30s"
write_timeout = "60s"
keep_alive         = true
keep_alive_timeout = "75s"
root  = "/var/www/html"
index = ["index.html", "index.php"]
max_connections = 0

# ─────────────────────────────────────────────────────────────────────────────
# TLS
# ─────────────────────────────────────────────────────────────────────────────
[tls]
enabled                = true
cert                   = "/etc/flashlin/certs/fullchain.pem"
key                    = "/etc/flashlin/certs/privkey.pem"
redirect_http_to_https = true
http_port              = 80

# ─────────────────────────────────────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────────────────────────────────────
[security]
max_body_size        = "20MB"
max_header_size      = "32KB"
hide_server_header   = true
block_dotfiles       = true
block_sensitive_files = true
security_headers     = true

[security.rate_limit]
limit = "200/min"
burst = 50

# ─────────────────────────────────────────────────────────────────────────────
# Compression
# ─────────────────────────────────────────────────────────────────────────────
[compression]
gzip     = true
brotli   = true
min_size = 1024

# ─────────────────────────────────────────────────────────────────────────────
# Cache (static files only)
# ─────────────────────────────────────────────────────────────────────────────
[cache]
enabled       = true
max_size      = "128MB"
ttl           = "300s"
max_file_size = "10MB"

# ─────────────────────────────────────────────────────────────────────────────
# PHP-FPM
# ─────────────────────────────────────────────────────────────────────────────
[php]
enabled         = true
default_handler = "php82"

[[php.handlers]]
name          = "php82"
mode          = "fpm"
address       = "php-fpm:9000"
document_root = "/var/www/html"
index         = "index.php"
timeout       = "30s"
max_body_size = "20MB"

# ─────────────────────────────────────────────────────────────────────────────
# Routes
# ─────────────────────────────────────────────────────────────────────────────
[[routes]]
path        = "/"
root        = "/var/www/html"
index       = "index.php"
php_handler = "php82"
php_enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
[logging]
level = "info"
json  = true
