services:
  flashlin:
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
    image: flashlin-benchmark:local
    command: ["flashlin", "/bench/flashlin.toml"]
    volumes:
      - ./flashlin.toml:/bench/flashlin.toml:ro
      - ../target/benchmark-fixture:/data:ro
    cpus: 2
    mem_limit: 512m
  nginx:
    image: nginx:stable-bookworm
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../target/benchmark-fixture:/data:ro
    cpus: 2
    mem_limit: 512m
  apache:
    image: httpd:2.4-bookworm
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ../target/benchmark-fixture:/data:ro
    cpus: 2
    mem_limit: 512m
  load:
    image: flashlin-benchmark:local
    profiles: ["tools"]
    command: ["benchmark", "http://flashlin:8080/small.txt", "30", "32", "1024"]
