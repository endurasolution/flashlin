[server]
host = "127.0.0.1"
port = 18082
workers = 2
root = "./target/benchmark-fixture"
keep_alive = true
keep_alive_timeout = "30s"
max_connections = 4096
[cache]
enabled = false
[compression]
gzip = false
brotli = false
[logging]
level = "error"
json = true
[[routes]]
path = "/"
root = "./target/benchmark-fixture"
php_enabled = false
