ServerRoot "/etc/apache2"
PidFile /run/apache2/bench.pid
DefaultRuntimeDir /run/apache2
Listen 127.0.0.1:18080
ServerName localhost
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
User www-data
Group www-data
ErrorLog /dev/stderr
LogLevel error
TypesConfig /etc/mime.types
DocumentRoot "/srv/bench"
<Directory "/srv/bench">
    Require all granted
    AllowOverride None
    Options None
</Directory>
KeepAlive On
MaxKeepAliveRequests 1000000
KeepAliveTimeout 30
ServerLimit 2
StartServers 2
ThreadLimit 64
ThreadsPerChild 64
MinSpareThreads 64
MaxSpareThreads 128
MaxRequestWorkers 128
MaxConnectionsPerChild 0
EnableSendfile On
EnableMMAP On
Protocols http/1.1
