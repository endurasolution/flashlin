worker_processes 2;
pid /run/nginx-bench.pid;
error_log /dev/stderr error;
events { worker_connections 4096; }
http {
    access_log off;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000000;
    gzip off;
    open_file_cache off;
    server {
        listen 127.0.0.1:18080 backlog=4096;
        root /srv/bench;
    }
}
